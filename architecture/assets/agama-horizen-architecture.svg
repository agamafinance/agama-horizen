<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 810" width="1440" height="810" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#ffffff"/>
    </marker>
    <marker id="am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#9fd9b8"/>
    </marker>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0 H0 V48" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1440" height="810" fill="#254839"/>
  <rect width="1440" height="810" fill="url(#grid)"/>
  <rect x="18" y="18" width="1404" height="774" fill="none" stroke="#ffffff" stroke-opacity="0.09" stroke-width="1" rx="8"/>

  <text x="52" y="66" fill="#ffffff" font-size="27" font-weight="700">Confidential book, public risk surface</text>
  <text x="52" y="90" fill="#c2d6cb" font-size="14">Horizen Chain 26514 &#183; white border: built by Agama &#183; mint border: already live on Horizen</text>

  <!-- ============================ ZONE: CONFIDENTIAL ============================ -->
  <rect x="42" y="116" width="390" height="378" rx="16" fill="#2e4a3c" fill-opacity="0.55" stroke="#6e8c7d" stroke-width="1.2" stroke-dasharray="6 5"/>
  <text x="62" y="142" fill="#9fd9b8" font-size="12.5" font-weight="700" letter-spacing="1.4">CONFIDENTIAL, OFF CHAIN</text>

  <rect x="62" y="158" width="348" height="104" rx="13" fill="#37574a" stroke="#ffffff" stroke-width="1.5"/>
  <text x="82" y="186" fill="#ffffff" font-size="16.5" font-weight="700">Loan book</text>
  <text x="82" y="209" fill="#c2d6cb" font-size="12.5">obligor, principal, maturity, payment schedule,</text>
  <text x="82" y="228" fill="#c2d6cb" font-size="12.5">delinquency status, commitment date, salt</text>
  <text x="82" y="250" fill="#9fd9b8" font-size="12.5">never leaves the originator</text>

  <rect x="62" y="280" width="348" height="98" rx="13" fill="#37574a" stroke="#ffffff" stroke-width="1.5"/>
  <text x="82" y="308" fill="#ffffff" font-size="16.5" font-weight="700">Attestation prover</text>
  <text x="82" y="331" fill="#c2d6cb" font-size="12.5">Noir, UltraHonk &#183; 65,939 ACIR opcodes</text>
  <text x="82" y="350" fill="#c2d6cb" font-size="12.5">3.0 s to prove &#183; 14,592 B proof</text>
  <text x="82" y="369" fill="#9fd9b8" font-size="12.5">root, ladder, calendar, delinquency, top-1</text>

  <rect x="62" y="396" width="348" height="78" rx="13" fill="#2e4a3c" stroke="#ffffff" stroke-width="1.5"/>
  <text x="82" y="423" fill="#ffffff" font-size="16.5" font-weight="700">Verification agent</text>
  <text x="82" y="444" fill="#c2d6cb" font-size="12.5">full book access, underwrites the credit</text>
  <text x="82" y="463" fill="#9fd9b8" font-size="12.5">every access is an on-chain transaction</text>

  <!-- ============================ ZONE: COUNTERPARTIES ============================ -->
  <rect x="42" y="522" width="390" height="108" rx="16" fill="#2e4a3c" fill-opacity="0.55" stroke="#6e8c7d" stroke-width="1.2" stroke-dasharray="6 5"/>
  <text x="62" y="548" fill="#9fd9b8" font-size="12.5" font-weight="700" letter-spacing="1.4">COUNTERPARTIES</text>
  <rect x="62" y="560" width="166" height="54" rx="11" fill="#37574a" stroke="#ffffff" stroke-width="1.3"/>
  <text x="80" y="582" fill="#ffffff" font-size="14.5" font-weight="700">Depositors</text>
  <text x="80" y="601" fill="#c2d6cb" font-size="12">see risk, not names</text>
  <rect x="244" y="560" width="166" height="54" rx="11" fill="#37574a" stroke="#ffffff" stroke-width="1.3"/>
  <text x="262" y="582" fill="#ffffff" font-size="14.5" font-weight="700">Borrowers</text>
  <text x="262" y="601" fill="#c2d6cb" font-size="12">repay in USDC</text>

  <!-- ============================ ZONE: HORIZEN ============================ -->
  <rect x="560" y="116" width="838" height="514" rx="16" fill="#2e4a3c" fill-opacity="0.35" stroke="#9fd9b8" stroke-width="1.2"/>
  <text x="582" y="142" fill="#9fd9b8" font-size="12.5" font-weight="700" letter-spacing="1.4">HORIZEN CHAIN, PUBLIC STATE</text>

  <rect x="582" y="158" width="238" height="70" rx="13" fill="#37574a" stroke="#ffffff" stroke-width="1.5"/>
  <text x="602" y="184" fill="#ffffff" font-size="15.5" font-weight="700">HonkVerifier</text>
  <text x="602" y="205" fill="#c2d6cb" font-size="12.5">2,176,207 gas per proof</text>
  <text x="602" y="221" fill="#9fd9b8" font-size="12.5">USD 0.0065 at 0.001 gwei</text>

  <rect x="582" y="246" width="380" height="266" rx="13" fill="#37574a" stroke="#ffffff" stroke-width="1.8"/>
  <text x="602" y="274" fill="#ffffff" font-size="17" font-weight="700">CreditDisclosureRegistry</text>
  <text x="602" y="294" fill="#9fd9b8" font-size="12.5">open standard, IRiskSurface, MIT</text>

  <rect x="602" y="308" width="340" height="44" rx="9" fill="#3a5c4c" stroke="#6e8c7d" stroke-width="1"/>
  <text x="618" y="327" fill="#ffffff" font-size="13.5" font-weight="700">Book commitments</text>
  <text x="618" y="344" fill="#c2d6cb" font-size="11.5">append only, terms fixed before cash moves</text>

  <rect x="602" y="360" width="340" height="44" rx="9" fill="#3a5c4c" stroke="#6e8c7d" stroke-width="1"/>
  <text x="618" y="379" fill="#ffffff" font-size="13.5" font-weight="700">Forward cash calendar</text>
  <text x="618" y="396" fill="#c2d6cb" font-size="11.5">written before the period it covers begins</text>

  <rect x="602" y="412" width="340" height="44" rx="9" fill="#3a5c4c" stroke="#6e8c7d" stroke-width="1"/>
  <text x="618" y="431" fill="#ffffff" font-size="13.5" font-weight="700">Realised collections</text>
  <text x="618" y="448" fill="#c2d6cb" font-size="11.5">observed on chain, never asserted</text>

  <rect x="602" y="464" width="340" height="34" rx="9" fill="#2e4a3c" stroke="#9fd9b8" stroke-width="1"/>
  <text x="618" y="486" fill="#9fd9b8" font-size="12" font-weight="700">performanceRatio(epoch) = realised / scheduled</text>

  <rect x="986" y="246" width="390" height="266" rx="13" fill="#37574a" stroke="#ffffff" stroke-width="1.8"/>
  <text x="1006" y="274" fill="#ffffff" font-size="17" font-weight="700">AgamaCreditVault</text>
  <text x="1006" y="294" fill="#9fd9b8" font-size="12.5">ERC-4626, composable with any Horizen market</text>

  <rect x="1006" y="308" width="350" height="44" rx="9" fill="#3a5c4c" stroke="#6e8c7d" stroke-width="1"/>
  <text x="1022" y="327" fill="#ffffff" font-size="13.5" font-weight="700">NAV engine</text>
  <text x="1022" y="344" fill="#c2d6cb" font-size="11.5">proven surface x public impairment, no discretion</text>

  <rect x="1006" y="360" width="350" height="44" rx="9" fill="#3a5c4c" stroke="#6e8c7d" stroke-width="1"/>
  <text x="1022" y="379" fill="#ffffff" font-size="13.5" font-weight="700">First-loss escrow</text>
  <text x="1022" y="396" fill="#c2d6cb" font-size="11.5">originator junior, depletion is public</text>

  <rect x="1006" y="412" width="350" height="44" rx="9" fill="#3a5c4c" stroke="#6e8c7d" stroke-width="1"/>
  <text x="1022" y="431" fill="#ffffff" font-size="13.5" font-weight="700">Redemption queue</text>
  <text x="1022" y="448" fill="#c2d6cb" font-size="11.5">public state, one pro-rata ratio for everyone</text>

  <rect x="1006" y="464" width="350" height="34" rx="9" fill="#2e4a3c" stroke="#9fd9b8" stroke-width="1"/>
  <text x="1022" y="486" fill="#9fd9b8" font-size="12" font-weight="700">coverageRatio() warns 30 days ahead of the cash</text>

  <rect x="582" y="534" width="232" height="76" rx="13" fill="#2e4a3c" stroke="#9fd9b8" stroke-width="1.5"/>
  <text x="602" y="560" fill="#9fd9b8" font-size="15" font-weight="700">PureFi Verifier</text>
  <text x="602" y="580" fill="#c2d6cb" font-size="12">0x681Edd49&#8230;83e1329c</text>
  <text x="602" y="597" fill="#c2d6cb" font-size="12">synchronous AML, blocking call</text>

  <rect x="838" y="534" width="232" height="76" rx="13" fill="#2e4a3c" stroke="#9fd9b8" stroke-width="1.5"/>
  <text x="858" y="560" fill="#9fd9b8" font-size="15" font-weight="700">USDC.e</text>
  <text x="858" y="580" fill="#c2d6cb" font-size="12">0xDF7108f8&#8230;cbf86B6c</text>
  <text x="858" y="597" fill="#c2d6cb" font-size="12">LayerZero OFT from Base</text>

  <rect x="1094" y="534" width="282" height="76" rx="13" fill="#2e4a3c" stroke="#9fd9b8" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="1114" y="560" fill="#9fd9b8" font-size="15" font-weight="700">Vela, Phase 2</text>
  <text x="1114" y="580" fill="#c2d6cb" font-size="12">book moves into the enclave, plus a</text>
  <text x="1114" y="597" fill="#c2d6cb" font-size="12">deanonymisation channel for the agent</text>

  <!-- ============================ SETTLEMENT ============================ -->
  <rect x="42" y="664" width="1356" height="58" rx="13" fill="#2e4a3c" stroke="#9fd9b8" stroke-width="1.3"/>
  <text x="66" y="690" fill="#9fd9b8" font-size="14.5" font-weight="700">Base</text>
  <text x="120" y="690" fill="#c2d6cb" font-size="13">settlement surface for Horizen state commitments</text>
  <text x="540" y="690" fill="#9fd9b8" font-size="14.5" font-weight="700">Ethereum</text>
  <text x="626" y="690" fill="#c2d6cb" font-size="13">root of trust</text>
  <text x="66" y="710" fill="#c2d6cb" font-size="12">OP Stack rollup, 1.00 s blocks measured over 50,000 blocks, gas 0.001 gwei, gas token ETH</text>

  <!-- ============================ ARROWS ============================ -->
  <path d="M236 262 L236 280" stroke="#ffffff" stroke-width="1.6" fill="none" marker-end="url(#a)"/>
  <text x="248" y="277" fill="#c2d6cb" font-size="11.5">private witness</text>

  <path d="M410 312 L582 208" stroke="#ffffff" stroke-width="1.8" fill="none" marker-end="url(#a)"/>
  <text x="496" y="236" fill="#ffffff" font-size="11.5" font-weight="700" text-anchor="middle">proof and</text>
  <text x="496" y="251" fill="#ffffff" font-size="11.5" font-weight="700" text-anchor="middle">17 public inputs</text>

  <path d="M701 228 L701 246" stroke="#ffffff" stroke-width="1.6" fill="none" marker-end="url(#a)"/>
  <text x="714" y="243" fill="#c2d6cb" font-size="11.5">verified, then stored</text>

  <path d="M410 434 L582 434" stroke="#ffffff" stroke-width="1.6" fill="none" marker-end="url(#a)"/>
  <text x="496" y="404" fill="#ffffff" font-size="11.5" font-weight="700" text-anchor="middle">attest(): who</text>
  <text x="496" y="419" fill="#ffffff" font-size="11.5" font-weight="700" text-anchor="middle">looked, and when</text>

  <path d="M410 578 L582 492" stroke="#9fd9b8" stroke-width="1.6" fill="none" marker-end="url(#am)"/>
  <text x="496" y="512" fill="#9fd9b8" font-size="11.5" font-weight="700" text-anchor="middle">repayments,</text>
  <text x="496" y="527" fill="#9fd9b8" font-size="11.5" font-weight="700" text-anchor="middle">USDC on chain</text>

  <path d="M962 330 L986 330" stroke="#ffffff" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <text x="974" y="430" fill="#ffffff" font-size="11.5" font-weight="700" text-anchor="middle" transform="rotate(-90 974 430)">risk surface, read on chain</text>

  <path d="M145 560 L145 545 L228 545" stroke="#ffffff" stroke-width="1.4" fill="none" marker-end="url(#a)" opacity="0"/>
</svg>
