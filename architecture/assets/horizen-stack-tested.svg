<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 700" width="1440" height="700" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="w" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#ffffff"/>
    </marker>
    <pattern id="g2" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0 H0 V48" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1440" height="700" fill="#254839"/>
  <rect width="1440" height="700" fill="url(#g2)"/>
  <rect x="18" y="18" width="1404" height="664" fill="none" stroke="#ffffff" stroke-opacity="0.09" stroke-width="1" rx="8"/>

  <text x="52" y="64" fill="#ffffff" font-size="26" font-weight="700">What we exercised of the Horizen stack</text>
  <text x="52" y="88" fill="#c2d6cb" font-size="13.5">Each box is a Horizen component. The badge is how far we took it, not how far the documentation says it goes.</text>

  <!-- VELA -->
  <rect x="42" y="120" width="330" height="290" rx="14" fill="#37574a" stroke="#ffffff" stroke-width="1.6"/>
  <rect x="62" y="140" width="126" height="24" rx="12" fill="#1c3a2d" stroke="#9fd9b8" stroke-width="1"/>
  <text x="125" y="156" fill="#9fd9b8" font-size="11" font-weight="700" text-anchor="middle">RUN LOCALLY</text>
  <text x="62" y="192" fill="#ffffff" font-size="19" font-weight="700">Vela</text>
  <text x="62" y="212" fill="#c2d6cb" font-size="12.5">TEE coprocessor, v0.2.0 starter kit</text>
  <text x="62" y="240" fill="#ffffff" font-size="12.5">Nine containers, full lifecycle executed:</text>
  <text x="62" y="261" fill="#c2d6cb" font-size="12.5">WASM app into the enclave</text>
  <text x="62" y="280" fill="#c2d6cb" font-size="12.5">P-521 key registered on-chain</text>
  <text x="62" y="299" fill="#c2d6cb" font-size="12.5">confidential deposit, balance read back</text>
  <text x="62" y="318" fill="#c2d6cb" font-size="12.5">authority granted, report decrypted</text>
  <rect x="62" y="334" width="290" height="58" rx="10" fill="#2e4a3c" stroke="#e8b04b" stroke-width="1.3"/>
  <text x="76" y="354" fill="#e8b04b" font-size="12" font-weight="700">Finding that moved it off Phase 1</text>
  <text x="76" y="372" fill="#c2d6cb" font-size="11.5">not on any testnet, emulated enclave,</text>
  <text x="76" y="386" fill="#c2d6cb" font-size="11.5">keys in plaintext. No attestation to rely on.</text>

  <!-- ZK -->
  <rect x="396" y="120" width="330" height="290" rx="14" fill="#37574a" stroke="#ffffff" stroke-width="1.6"/>
  <rect x="416" y="140" width="150" height="24" rx="12" fill="#1c3a2d" stroke="#9fd9b8" stroke-width="1"/>
  <text x="491" y="156" fill="#9fd9b8" font-size="11" font-weight="700" text-anchor="middle">BUILT AND VERIFIED</text>
  <text x="416" y="192" fill="#ffffff" font-size="19" font-weight="700">Zero knowledge</text>
  <text x="416" y="212" fill="#c2d6cb" font-size="12.5">Noir + UltraHonk, verified on Horizen</text>
  <text x="416" y="240" fill="#ffffff" font-size="12.5">Two circuits, written not described:</text>
  <text x="416" y="261" fill="#c2d6cb" font-size="12.5">book_attest, the risk surface, 66k opcodes</text>
  <text x="416" y="280" fill="#c2d6cb" font-size="12.5">book_delta, honest revisions, 6.9k opcodes</text>
  <text x="416" y="299" fill="#c2d6cb" font-size="12.5">3.0 s and 1.2 s to prove</text>
  <text x="416" y="318" fill="#c2d6cb" font-size="12.5">verified on-chain, 2,364,745 gas</text>
  <rect x="416" y="334" width="290" height="58" rx="10" fill="#2e4a3c" stroke="#9fd9b8" stroke-width="1.3"/>
  <text x="430" y="354" fill="#9fd9b8" font-size="12" font-weight="700">Finding on zkVerify</text>
  <text x="430" y="372" fill="#c2d6cb" font-size="11.5">live, but its EVM contracts are not on</text>
  <text x="430" y="386" fill="#c2d6cb" font-size="11.5">Horizen L3. At 0.001 gwei, direct is free.</text>

  <!-- CHAIN -->
  <rect x="750" y="120" width="330" height="290" rx="14" fill="#37574a" stroke="#ffffff" stroke-width="1.6"/>
  <rect x="770" y="140" width="126" height="24" rx="12" fill="#1c3a2d" stroke="#9fd9b8" stroke-width="1"/>
  <text x="833" y="156" fill="#9fd9b8" font-size="11" font-weight="700" text-anchor="middle">DEPLOYED</text>
  <text x="770" y="192" fill="#ffffff" font-size="19" font-weight="700">Horizen Chain</text>
  <text x="770" y="212" fill="#c2d6cb" font-size="12.5">testnet 2651420, mainnet 26514</text>
  <text x="770" y="240" fill="#ffffff" font-size="12.5">Live, and source-verified on the explorer:</text>
  <text x="770" y="261" fill="#c2d6cb" font-size="12.5">full disclosure cycle executed on-chain</text>
  <text x="770" y="280" fill="#c2d6cb" font-size="12.5">two surfaces and one revision verified</text>
  <text x="770" y="299" fill="#c2d6cb" font-size="12.5">four-party queue settled at one ratio</text>
  <text x="770" y="318" fill="#c2d6cb" font-size="12.5">ten attacks mined as reverts</text>
  <rect x="770" y="334" width="290" height="58" rx="10" fill="#2e4a3c" stroke="#e8b04b" stroke-width="1.3"/>
  <text x="784" y="354" fill="#e8b04b" font-size="12" font-weight="700">Operational note</text>
  <text x="784" y="372" fill="#c2d6cb" font-size="11.5">the testnet sequencer stalled twenty</text>
  <text x="784" y="386" fill="#c2d6cb" font-size="11.5">minutes mid-deployment, then caught up.</text>

  <!-- PUREFI -->
  <rect x="1104" y="120" width="294" height="290" rx="14" fill="#2e4a3c" stroke="#9fd9b8" stroke-width="1.6"/>
  <rect x="1124" y="140" width="126" height="24" rx="12" fill="#1c3a2d" stroke="#9fd9b8" stroke-width="1"/>
  <text x="1187" y="156" fill="#9fd9b8" font-size="11" font-weight="700" text-anchor="middle">INTEGRATED</text>
  <text x="1124" y="192" fill="#9fd9b8" font-size="19" font-weight="700">PureFi</text>
  <text x="1124" y="212" fill="#c2d6cb" font-size="12.5">AML, live on Horizen mainnet</text>
  <text x="1124" y="240" fill="#ffffff" font-size="12.5">Confirmed callable on-chain and</text>
  <text x="1124" y="259" fill="#ffffff" font-size="12.5">wired into the deposit path.</text>
  <text x="1124" y="287" fill="#c2d6cb" font-size="12">A failed screen reverts the whole</text>
  <text x="1124" y="305" fill="#c2d6cb" font-size="12">transaction, so a non-compliant</text>
  <text x="1124" y="323" fill="#c2d6cb" font-size="12">deposit never exists as state.</text>
  <rect x="1124" y="342" width="254" height="44" rx="10" fill="#37574a" stroke="#6e8c7d" stroke-width="1"/>
  <text x="1138" y="360" fill="#c2d6cb" font-size="11">Verifier proxy</text>
  <text x="1138" y="377" fill="#9fd9b8" font-size="11">0x681Edd49&#8230;83e1329c</text>

  <!-- what it adds up to -->
  <rect x="42" y="440" width="1356" height="98" rx="14" fill="#37574a" stroke="#ffffff" stroke-width="1.6"/>
  <text x="66" y="470" fill="#ffffff" font-size="16.5" font-weight="700">What the evaluation changed in the design</text>
  <text x="66" y="496" fill="#c2d6cb" font-size="13">Vela leaves the critical path and becomes Phase 2, because a hardware guarantee that is not deployed cannot carry a mainnet product.</text>
  <text x="66" y="518" fill="#c2d6cb" font-size="13">zkVerify becomes optional rather than a dependency, because on this chain a proof verifies directly for about two thirds of a US cent.</text>

  <path d="M207 410 L207 440" stroke="#ffffff" stroke-width="1.5" fill="none" marker-end="url(#w)"/>
  <path d="M561 410 L561 440" stroke="#ffffff" stroke-width="1.5" fill="none" marker-end="url(#w)"/>
  <path d="M915 410 L915 440" stroke="#ffffff" stroke-width="1.5" fill="none" marker-end="url(#w)"/>

  <rect x="42" y="562" width="1356" height="98" rx="14" fill="#2e4a3c" stroke="#9fd9b8" stroke-width="1.3"/>
  <text x="66" y="592" fill="#9fd9b8" font-size="16.5" font-weight="700">The question our own application left open, in its own words</text>
  <text x="66" y="618" fill="#ffffff" font-size="13" font-style="italic">"What remains genuinely unsolved is detecting an issuer that signs accurate-looking but false state.</text>
  <text x="66" y="638" fill="#ffffff" font-size="13" font-style="italic">That's an attestation and audit problem, not a cryptographic one, and we don't pretend otherwise."</text>
  <text x="1080" y="638" fill="#c2d6cb" font-size="12">Builder Fund application, section 3, 4 September 2026</text>
</svg>
