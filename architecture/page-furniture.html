<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Agama page furniture</title>
<style>
  /* One A4 page holding only the running header and footer bands.
     build.sh renders this once and stamps it onto every page, because Chrome
     will not let a position:fixed element be painted inside the page margins.
     Band heights here must stay in step with @page in style.css
     (top margin 20mm, bottom margin 13mm). */

  @page { size: A4; margin: 0; }
  html { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  body { margin: 0; font-family: "Helvetica Neue", Helvetica, "Segoe UI", Arial, sans-serif; }

  .band-top,
  .band-bottom { position: absolute; left: 0; right: 0; background: #254839; }

  .band-top {
    top: 0;
    height: 14.7mm;
    display: flex;
    align-items: center;
    padding: 0 5mm;
    box-sizing: border-box;
  }

  .band-top .lockup { height: 5.7mm; display: block; }

  /* Horizen wordmark, recoloured white from the brand SVG. Sized a touch
     shorter than the Agama lockup because it is a pure all-caps wordmark with
     no descenders, so it reads larger at the same height. */
  .band-top .chain {
    height: 4.2mm;
    display: block;
    /* The rule sits on this element's left edge, so margin-left is the gap
       before it and padding-left the gap after. The Agama lockup carries
       transparent padding on its right, so equal values put the rule visually
       off centre; these are set by eye against the rendered band. */
    margin-left: 2.3mm;
    padding-left: 4.1mm;
    border-left: 0.75pt solid rgba(255,255,255,0.45);
    box-sizing: content-box;
    /* The wordmark's glyphs sit high in their box, so optical centring needs a
       nudge that flex alignment will not give. */
    position: relative;
    top: 0.35mm;
  }

  .band-top .url {
    margin-left: auto;
    color: #fff;
    font-size: 11.5px;
    letter-spacing: 0.1px;
    text-decoration: none;
  }

  .band-bottom { bottom: 0; height: 7mm; }

  .band-bottom::after {
    content: "";
    position: absolute;
    left: 3.5mm;
    right: 3.5mm;
    top: 50%;
    height: 0.75pt;
    background: #fff;
  }
</style>
</head>
<body>
  <div class="band-top">
    <img class="lockup" src="assets/agama-lockup.png" alt="Agama">
    <img class="chain" src="assets/horizen-wordmark-white.png" alt="Horizen">
    <a class="url" href="https://agama.finance">agama.finance</a>
  </div>
  <div class="band-bottom"></div>
</body>
</html>
